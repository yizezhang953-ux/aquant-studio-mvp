app = "aquant-studio-api"
primary_region = "sin"

[build]
  dockerfile = "web_app/deploy/backend.Dockerfile"

[env]
  APP_ENV = "production"
  LIVE_TRADING_ENABLED = "false"
  # SQLite on the persistent volume below. For PostgreSQL set DATABASE_URL as a secret instead:
  #   fly secrets set DATABASE_URL=postgresql+psycopg://...
  DATABASE_URL = "sqlite:////data/aquant_web_app.db"
  BACKUP_DIR = "/data/backups"
  # Replace with your frontend origin(s), comma-separated.
  ALLOWED_ORIGINS = "https://aquant-studio-web.fly.dev"
  # After the first deploy: register your account, then grant the admin role with
  #   fly ssh console -C "python -m app.tasks.database_maintenance make-admin you@example.com"
  # Set ALLOW_REGISTRATION = "false" afterwards if the site is private.

# Create once: fly volumes create aquant_data --size 1 --region sin
[[mounts]]
  source = "aquant_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
